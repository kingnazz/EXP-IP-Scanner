name: Temporary v1.4.0 release candidate validation

# Final RC validation after syncing Tauri JavaScript plugin versions.
on:
  push:
    branches: ["feat/web-exposure-security"]
    paths:
      - .github/workflows/release-candidate-validation.yml

permissions:
  contents: read

jobs:
  frontend-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check-version
      - run: npm run check-release-page
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Portable tests
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-portable
        run: cargo test --no-default-features --features portable
      - name: Portable Clippy
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-portable
        run: cargo clippy --all-targets --no-default-features --features portable -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build installer
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis
      - name: Build portable executable
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-portable
        run: cargo build --release --target x86_64-pc-windows-msvc --no-default-features --features portable,custom-protocol