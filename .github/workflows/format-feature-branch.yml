name: Format feature branch

on:
  push:
    branches: ["feat/web-exposure-security"]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-exposure-security
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri; then
            echo "Rust files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "Format Rust security changes"
          git push origin HEAD:feat/web-exposure-security
