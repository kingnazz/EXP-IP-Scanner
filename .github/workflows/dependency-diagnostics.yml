name: Temporary v1.4.0 release prep

on:
  push:
    branches: ["feat/web-exposure-security"]
    paths:
      - .github/workflows/dependency-diagnostics.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/web-exposure-security
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Write 1.4.0 release notes and website copy
        shell: python
        run: |
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          block = '''## 1.4.0

### Added

- A passive **Security** pass checks every discovered device with a supported HTTP or HTTPS service and highlights systems that need attention.
- PHP2Shell assessment for **CVE-2026-109618** and **CVE-2026-109619**, including fixed-version checks for supported PHP 8.2 through 8.5 branches.
- A **Website** check accepts a hostname or HTTP/HTTPS URL and preserves the real hostname for HTTPS SNI and virtual hosting.
- Results show **Critical**, **Needs Review**, **Clear**, or **Unknown** instead of treating every PHP indicator as a confirmed vulnerability.
- An **Issues** filter and subtle red or amber shield indicators make affected or uncertain devices easy to isolate after a network-wide security pass.
- Passive fingerprinting recognizes Synology DSM, WordPress, phpMyAdmin, Apache, nginx, and generic PHP web applications.

### Changed

- Security checks run silently in the background on Windows, so the operating-system curl client no longer flashes Command Prompt windows during a scan.
- Network-wide security checks are capped at four devices at a time to keep the scan responsive and avoid hammering customer infrastructure.
- Synology DSM ports 5000 and 5001 are included in the default service scan.
- Hidden PHP versions and legacy or vendor-managed PHP builds are sent to review instead of being labeled vulnerable without enough evidence.
- Rust security dependencies were refreshed, including patched rustls and webpki versions. The updater is pinned to an exact official Tauri source revision that uses the patched ZIP 9 dependency line.

### Notes

- The PHP2Shell check is passive. It sends ordinary HTTP/HTTPS requests and does not send exploit payloads or attempt remote code execution.
- A Clear result means the checked service did not expose an affected upstream PHP version. Hidden or embedded PHP may still require direct server or vendor verification.

'''
          if '## 1.4.0' not in text:
              text = text.replace('## 1.3.0', block + '## 1.3.0', 1)
              changelog.write_text(text)

          releases = Path('site/releases.html')
          text = releases.read_text()
          card = '''            <article class="release-card">
              <div class="release-version">1.4.0</div>
              <div class="release-summary">
                <h3>PHP2Shell checks for devices and websites</h3>
                <p>Run a passive security pass across discovered web devices or check a website directly. EXP IP Scanner identifies PHP exposure, classifies PHP2Shell patch status, and highlights critical or review devices without sending exploit payloads.</p>
              </div>
              <div class="release-actions">
                <a href="whats-new-1.4.0.html">Read what changed</a>
                <a href="https://github.com/nazar-exp/EXP-IP-Scanner/releases/tag/v1.4.0">Downloads</a>
              </div>
            </article>
'''
          marker = '            <article class="release-card">\n              <div class="release-version">1.3.0</div>'
          if 'release-version">1.4.0<' not in text:
              text = text.replace(marker, card + marker, 1)
              releases.write_text(text)

          notes = Path('site/whats-new-1.4.0.html')
          notes.write_text('''<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What’s new in EXP IP Scanner 1.4.0</title>
    <meta name="description" content="EXP IP Scanner 1.4.0 adds passive PHP2Shell checks for discovered devices and public website URLs." />
    <link rel="canonical" href="https://expipscanner.com/whats-new-1.4.0.html" />
    <link rel="icon" href="assets/favicon.png" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="exp.v5.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap bar">
        <a class="brand" href="./" aria-label="EXP IP Scanner home">
          <img src="assets/exp-ip-scanner-logo.svg" alt="EXP IP Scanner" width="1874" height="347" />
        </a>
        <nav aria-label="Site">
          <a href="./#features">Features</a>
          <a href="./#screenshots">Screenshots</a>
          <a href="releases.html">Changelog</a>
          <a href="privacy.html">Privacy</a>
          <a class="header-cta" href="./#download">Download</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <section>
        <div class="wrap whats-new">
          <p class="kicker">EXP IP Scanner 1.4.0</p>
          <h1>Find PHP2Shell exposure without turning the scanner into an exploit tool.</h1>
          <p class="lede">Version 1.4.0 adds a focused passive security layer for PHP2Shell. Check every web-enabled device found on a network, or paste a website URL and check it directly.</p>

          <h2>Check the whole network after discovery</h2>
          <p>After a normal network scan, press <strong>Security</strong> to check discovered HTTP and HTTPS services. EXP IP Scanner runs a bounded passive assessment, shows progress, and marks Critical or Needs Review devices with subtle shield indicators. Use the <strong>Issues</strong> filter to isolate them immediately.</p>

          <h2>Know when an exposed PHP version is below the fix</h2>
          <p>The scanner looks for PHP runtime indicators and disclosed versions, then compares supported PHP 8.2 through 8.5 branches with the upstream fixed releases for CVE-2026-109618 and CVE-2026-109619. A positively affected disclosed version is Critical. A hidden version is Needs Review rather than a guess.</p>

          <h2>Check a public website by hostname</h2>
          <p>The new <strong>Website</strong> check accepts a bare hostname or a full HTTP/HTTPS URL. It keeps the original hostname through HTTPS so SNI, reverse proxies, Cloudflare, and virtual-hosted sites are checked the way a browser reaches them.</p>

          <h2>Passive by design</h2>
          <p>The security pass uses ordinary HTTP and HTTPS requests only. It does not send exploit payloads, execute code, or automatically perform destructive validation. A Clear result means no affected upstream PHP version was exposed by the checked response, not that hidden backend software is guaranteed patched.</p>

          <h2>Better field behavior</h2>
          <p>Web fingerprinting now runs without flashing Command Prompt windows. Network-wide checks are limited to four devices at a time, and Synology DSM ports 5000 and 5001 are included in the default scan so common NAS management surfaces are easier to identify.</p>

          <h2>Security maintenance under the hood</h2>
          <p>The Rust dependency set was refreshed for current TLS and certificate-validation fixes. The desktop updater is pinned to an exact official Tauri source revision that uses the patched ZIP 9 dependency line.</p>

          <div class="cta-row">
            <a class="btn btn-primary" href="./#download">Download 1.4.0</a>
            <a class="btn btn-secondary" href="releases.html">All releases</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <div class="product-footer">
          <div class="product-footer-brand">
            <img src="assets/exp-ip-scanner-logo-light.svg" alt="EXP IP Scanner" width="1874" height="347" />
            <p>Fast, local network discovery for consultants.</p>
          </div>
          <nav aria-label="Footer">
            <a href="./#download">Download</a>
            <a href="releases.html">Changelog</a>
            <a href="privacy.html">Privacy</a>
            <a href="https://github.com/nazar-exp/EXP-IP-Scanner">GitHub</a>
          </nav>
        </div>
        <div class="footer-bottom">
          <span>EXP IP Scanner · MIT licensed</span>
          <span>Built by EXP Technical</span>
        </div>
      </div>
    </footer>
  </body>
</html>
''')

          index = Path('site/index.html')
          text = index.read_text()
          text = text.replace(
              'See hostname, MAC address, manufacturer, latency, and common services without opening another tool.',
              'See hostname, MAC address, manufacturer, latency, and common services without opening another tool. Run a passive PHP security check across discovered web services when you need it.',
          )
          text = text.replace(
              'without turning a quick scan into a monitoring platform, asset database, or security suite.',
              'without turning a quick scan into a monitoring platform, asset database, or full vulnerability suite.',
          )
          index.write_text(text)
      - name: Bump and synchronize version
        shell: bash
        run: |
          set -euxo pipefail
          npm version 1.4.0 --no-git-tag-version
          npm run sync-version
          npm run check-version
          npm run check-release-page
      - name: Commit v1.4.0 release candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/updater.conf.json site/index.html site/exp.v3.js site/releases.html site/privacy.html site/whats-new-1.4.0.html CHANGELOG.md
          git commit -m "Prepare v1.4.0 release"
          git push origin HEAD:feat/web-exposure-security
