name: Temporary v1.4.0 release prep

on:
  push:
    branches: ["feat/web-exposure-security"]
    paths:
      - .github/workflows/dependency-diagnostics.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/web-exposure-security
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Write v1.4.0 website and changelog copy
        shell: python
        env:
          CHANGE_B64: 
          CARD_B64: 
          NOTES_B64: 
        run: |
          import base64, os
          from pathlib import Path
          changelog_block = base64.b64decode(os.environ['CHANGE_B64']).decode()
          card = base64.b64decode(os.environ['CARD_B64']).decode()
          notes = base64.b64decode(os.environ['NOTES_B64']).decode()
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## 1.4.0' not in text:
              changelog.write_text(text.replace('## 1.3.0', changelog_block + '## 1.3.0', 1))
          releases = Path('site/releases.html')
          text = releases.read_text()
          marker = '            <article class="release-card">\n              <div class="release-version">1.3.0</div>'
          if 'release-version">1.4.0<' not in text:
              releases.write_text(text.replace(marker, card + marker, 1))
          Path('site/whats-new-1.4.0.html').write_text(notes)
          index = Path('site/index.html')
          text = index.read_text()
          text = text.replace('See hostname, MAC address, manufacturer, latency, and common services without opening another tool.', 'See hostname, MAC address, manufacturer, latency, and common services without opening another tool. Run a passive PHP security check across discovered web services when you need it.')
          text = text.replace('without turning a quick scan into a monitoring platform, asset database, or security suite.', 'without turning a quick scan into a monitoring platform, asset database, or full vulnerability suite.')
          index.write_text(text)
      - name: Bump and synchronize version
        shell: bash
        run: |
          set -euxo pipefail
          npm version 1.4.0 --no-git-tag-version
          npm run sync-version
          npm run check-version
          npm run check-release-page
      - name: Commit v1.4.0 release candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/updater.conf.json site/index.html site/exp.v3.js site/releases.html site/privacy.html site/whats-new-1.4.0.html CHANGELOG.md
          git commit -m "Prepare v1.4.0 release"
          git push origin HEAD:feat/web-exposure-security
