name: Sync EXP work repository

# The personal repository is the development source. A narrowly dedicated
# classic PAT (EXP_MIRROR_TOKEN) belonging to kingnazz pushes main + tags into
# the EXP-owned repository, then wakes the work-side Pages deployment.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'kingnazz/EXP-IP-Scanner'
    runs-on: ubuntu-latest
    env:
      EXP_MIRROR_TOKEN: ${{ secrets.EXP_MIRROR_TOKEN }}
      DEST_REPO: nazar-exp/EXP-IP-Scanner
    steps:
      - name: Mirror token is not configured yet
        if: env.EXP_MIRROR_TOKEN == ''
        run: echo "EXP_MIRROR_TOKEN is not configured; skipping the work-repo sync."

      - uses: actions/checkout@v4
        if: env.EXP_MIRROR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Push main and tags to the EXP-owned repository
        if: env.EXP_MIRROR_TOKEN != ''
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git remote remove exp 2>/dev/null || true
          git remote add exp "https://x-access-token:${EXP_MIRROR_TOKEN}@github.com/${DEST_REPO}.git"

          # main is authoritative while this mirror is enabled.
          git push exp HEAD:main --force
          git push exp --tags --force

          payload=$(jq -n --arg sha "$SOURCE_SHA"             '{event_type:"sync_from_personal",client_payload:{source_sha:$sha}}')
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $EXP_MIRROR_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$DEST_REPO/dispatches \
            --data "$payload"
