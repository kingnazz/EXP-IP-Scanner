name: Refresh audited dev dependency lockfile

on:
  push:
    branches: ["feat/web-exposure-security"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-exposure-security
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable packages within existing semver ranges
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run build
      - name: Commit lockfile refresh if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already resolves patched packages."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh audited frontend dependencies"
          git push origin HEAD:feat/web-exposure-security
