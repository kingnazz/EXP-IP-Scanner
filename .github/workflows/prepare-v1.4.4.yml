name: Prepare 1.4.4 release branch

on:
  push:
    branches: ["release/v1.4.4"]
    paths:
      - .github/workflows/prepare-v1.4.4.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bump version everywhere
        run: |
          npm version 1.4.4 --no-git-tag-version
          npm run sync-version

      - name: Add release notes and changelog entry
        shell: python
        run: |
          from pathlib import Path

          version = "1.4.4"
          notes_name = f"whats-new-{version}.html"

          notes = '''<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>What’s new in EXP IP Scanner 1.4.4</title>
              <meta name="description" content="EXP IP Scanner 1.4.4 removes TCP 53 from default scans to avoid false DNS service results on networks with transparent DNS proxying." />
              <link rel="canonical" href="https://expipscanner.com/whats-new-1.4.4.html" />
              <link rel="icon" href="assets/favicon.png" />
              <meta name="color-scheme" content="light" />
              <meta name="theme-color" content="#ffffff" />
              <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
              <link rel="stylesheet" href="exp.v5.css" />
            </head>
            <body>
              <a class="skip" href="#main">Skip to content</a>
              <header class="site-header">
                <div class="wrap bar">
                  <a class="brand" href="./" aria-label="EXP IP Scanner home"><img src="assets/exp-ip-scanner-logo.svg" alt="EXP IP Scanner" width="1874" height="347" /></a>
                  <nav aria-label="Site"><a href="./#features">Features</a><a href="./#security">Security</a><a href="./#screenshots">Screenshots</a><a href="releases.html">Changelog</a><a href="privacy.html">Privacy</a><a class="header-cta" href="./#download">Download</a></nav>
                </div>
              </header>
              <main id="main">
                <section>
                  <div class="wrap whats-new">
                    <p class="kicker">EXP IP Scanner 1.4.4</p>
                    <h1>Cleaner default scans on networks that intercept DNS.</h1>
                    <p class="lede">Version 1.4.4 removes TCP port 53 from the default service sweep. Some gateways transparently proxy or intercept DNS and accept a TCP connection for every address in the subnet, which can make unrelated devices look like they are running DNS.</p>
                    <h2>DNS is no longer probed by default</h2>
                    <p>The normal scan now checks 33 consultant-focused TCP ports without port 53, preventing gateway-level DNS behavior from creating misleading DNS service chips across the results table.</p>
                    <h2>Custom DNS scans still work</h2>
                    <p>DNS remains in the service catalog. If you explicitly include TCP 53 in a custom port list, EXP IP Scanner will scan it and identify it normally.</p>
                    <h2>No other default services were removed</h2>
                    <p>RDP, SMB, SSH, web management, printers, databases, Synology DSM, WinRM, SIP, and the other existing consultant-focused defaults remain unchanged.</p>
                    <h2>Why this is a patch release</h2>
                    <p>This is a targeted accuracy fix. It changes the default port selection only and does not alter vulnerability checks, device actions, update behavior, or stored scan data.</p>
                    <div class="cta-row"><a class="btn btn-primary" href="./#download">Download 1.4.4</a><a class="btn btn-secondary" href="releases.html">All releases</a></div>
                  </div>
                </section>
              </main>
              <footer class="site-footer"><div class="wrap"><div class="product-footer"><div class="product-footer-brand"><img src="assets/exp-ip-scanner-logo-light.svg" alt="EXP IP Scanner" width="1874" height="347" /><p>Fast network discovery and focused passive PHP vulnerability checks for consultants.</p></div><nav aria-label="Footer"><a href="./#security">Security</a><a href="./#download">Download</a><a href="releases.html">Changelog</a><a href="privacy.html">Privacy</a><a href="https://github.com/nazar-exp/EXP-IP-Scanner">GitHub</a></nav></div><div class="footer-bottom"><span>EXP IP Scanner · MIT licensed</span><span>Built by EXP Technical</span></div></div></footer>
            </body>
          </html>
          '''
          # Remove the indentation introduced by the workflow block while
          # keeping the page formatted like the existing release notes.
          import textwrap
          Path("site") .joinpath(notes_name).write_text(textwrap.dedent(notes), encoding="utf-8")

          releases_path = Path("site/releases.html")
          releases = releases_path.read_text(encoding="utf-8")
          card = '''            <article class="release-card">
              <div class="release-version">1.4.4</div>
              <div class="release-summary">
                <h3>Cleaner DNS service detection in default scans</h3>
                <p>TCP 53 is no longer part of the default service sweep, preventing gateways that transparently proxy DNS from making unrelated devices appear to run DNS. Port 53 remains available for explicit custom scans.</p>
              </div>
              <div class="release-actions">
                <a href="whats-new-1.4.4.html">Read what changed</a>
                <a href="https://github.com/nazar-exp/EXP-IP-Scanner/releases/tag/v1.4.4">Downloads</a>
              </div>
            </article>
'''
          anchor = '          <div class="release-list">\n'
          if 'whats-new-1.4.4.html' not in releases:
              if anchor not in releases:
                  raise SystemExit("release-list anchor not found")
              releases = releases.replace(anchor, anchor + card, 1)
              releases_path.write_text(releases, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          section = '''## 1.4.4

### Fixed

- Removed TCP port **53 (DNS)** from the default service scan so gateways that transparently proxy or intercept DNS do not make every address appear to expose DNS.
- Kept TCP 53 available in the service catalog and in explicit custom port scans, so intentional DNS checks continue to work normally.

### Notes

- The default consultant service set now contains 33 TCP ports.
- No other default services, device actions, PHP2Shell checks, or updater behavior changed in this patch.

'''
          if "## 1.4.4" not in changelog:
              anchor = "## 1.4.3\n"
              if anchor not in changelog:
                  raise SystemExit("1.4.3 changelog anchor not found")
              changelog = changelog.replace(anchor, section + anchor, 1)
              changelog_path.write_text(changelog, encoding="utf-8")

      - name: Verify release metadata
        run: |
          npm run check-version
          npm run check-release-page
          git diff --check

      - name: Commit prepared release
        run: |
          rm .github/workflows/prepare-v1.4.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 1.4.4 DNS default scan fix"
          git push origin HEAD:release/v1.4.4
