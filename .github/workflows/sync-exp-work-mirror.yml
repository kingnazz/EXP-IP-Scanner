name: Deploy EXP work mirror

# Source-side automation pushes main + tags into this repository, then sends a
# repository_dispatch. The work repo builds and deploys its own Pages site using
# its native GitHub Pages permissions. Product screenshots are captured from
# the current mirrored UI immediately before deployment so they cannot drift.
on:
  repository_dispatch:
    types: [sync_from_personal]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exp-work-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'nazar-exp/EXP-IP-Scanner'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture current product screenshots
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run preview > /tmp/exp-preview.log 2>&1 &
          npx --yes wait-on http://localhost:4173/ --timeout 60000
          npm i --no-save playwright
          npx --yes playwright install --with-deps chromium
          python3 -m pip install --user Pillow
          npm run screenshots

      - name: Build the Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r site _site
          shopt -s failglob
          for css in _site/exp.*.css; do
            npx --yes esbuild@0.24 "$css" --minify --outfile="$css" --allow-overwrite
          done
          for js in _site/exp.*.js; do
            npx --yes esbuild@0.24 "$js" --minify --target=es2018 --outfile="$js" --allow-overwrite
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy the EXP-owned Pages site
        id: deployment
        uses: actions/deploy-pages@v4
