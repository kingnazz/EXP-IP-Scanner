name: Temporary 1.4.1 GitLab wiring

on:
  push:
    branches: ["feat/security-cves-1.4.1"]
    paths:
      - .github/workflows/temp-141-wire-gitlab.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/security-cves-1.4.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire GitLab CVE rule and update UI copy
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          security_path = Path("src-tauri/src/security.rs")
          security = security_path.read_text()
          security = replace_once(
              security,
              "use tokio::process::Command;\n\nconst MAX_BODY_CHARS",
              "use tokio::process::Command;\n\nmod gitlab;\n\nconst MAX_BODY_CHARS",
              "module declaration",
          )
          security = replace_once(
              security,
              "    let product =\n        detect_product(port, server.as_deref(), powered_by.as_deref(), &body).or(fallback_product);",
              "    let product = gitlab::product_label(&headers, &body)\n        .or_else(|| detect_product(port, server.as_deref(), powered_by.as_deref(), &body))\n        .or(fallback_product);",
              "product detection",
          )
          security = replace_once(
              security,
              "    let mut seen_versions = HashSet::new();\n    let mut php_indicator_without_version = false;\n    let mut synology_ports = Vec::new();",
              "    let mut seen_versions = HashSet::new();\n    let mut seen_gitlab = HashSet::new();\n    let mut gitlab_version_disclosed = false;\n    let mut php_indicator_without_version = false;\n    let mut synology_ports = Vec::new();",
              "finding state",
          )
          security = replace_once(
              security,
              "        if service.product.as_deref() == Some(\"Synology DSM\") {\n            synology_ports.push(service.port);\n        }\n\n        if let Some(version) = service.php_version.as_deref() {",
              "        if service.product.as_deref() == Some(\"Synology DSM\") {\n            synology_ports.push(service.port);\n        }\n\n        if let Some(product) = service\n            .product\n            .as_deref()\n            .filter(|product| gitlab::is_gitlab_product(product))\n        {\n            if product != \"GitLab\" {\n                gitlab_version_disclosed = true;\n            }\n            if seen_gitlab.insert(product.to_string()) {\n                findings.push(gitlab::finding(product, service));\n            }\n        }\n\n        if let Some(version) = service.php_version.as_deref() {",
              "GitLab findings",
          )
          security = replace_once(
              security,
              "    if php_indicator_without_version && seen_versions.is_empty() {",
              "    if gitlab_version_disclosed {\n        findings.retain(|finding| finding.id != \"gitlab-rce-version-hidden\");\n    }\n\n    if php_indicator_without_version && seen_versions.is_empty() {",
              "hidden GitLab de-duplication",
          )
          security = security.replace(
              "Critical PHP2Shell exposure indicator found. Review the disclosed PHP version and patch path immediately.",
              "Critical web exposure indicator found. Review the affected product/version and patch immediately.",
          )
          security = security.replace(
              "A PHP runtime may need patch verification. The passive check could not prove a safe patch level.",
              "A detected web runtime or product needs patch verification. The passive check could not prove a safe patch level.",
          )
          security = replace_once(
              security,
              "    if services.iter().any(|service| service.php_version.is_some()) {\n        return (\n            \"clear\".into(),\n            \"No vulnerable upstream PHP 8.2-8.5 version was disclosed by the checked web service.\"\n                .into(),\n        );\n    }\n    (\n        \"clear\".into(),\n        \"No PHP runtime was identified in the passive web fingerprint. Hidden or embedded PHP can still require direct vendor/version verification.\".into(),\n    )",
              "    if findings.iter().any(|finding| !finding.cves.is_empty()) {\n        return (\n            \"clear\".into(),\n            \"No affected version was identified in the disclosed versions covered by the current PHP and GitLab security rules.\".into(),\n        );\n    }\n    (\n        \"clear\".into(),\n        \"No affected PHP or GitLab version was identified in the passive web fingerprint. Hidden or backend components can still require direct vendor/version verification.\".into(),\n    )",
              "clear summary",
          )
          security_path.write_text(security)

          drawer_path = Path("src/components/DeviceDrawer.tsx")
          drawer = drawer_path.read_text()
          drawer = replace_once(
              drawer,
              "Safe scan: fingerprints HTTP/HTTPS, PHP patch level and Synology indicators. It does not\n            attempt exploitation.",
              "Safe scan: fingerprints HTTP/HTTPS, PHP patch level, GitLab critical patch status and Synology indicators. It does not\n            attempt exploitation.",
              "drawer security copy",
          )
          drawer_path.write_text(drawer)

          dialog_path = Path("src/components/WebsiteCheckDialog.tsx")
          dialog = dialog_path.read_text()
          dialog = replace_once(dialog, "Website PHP Security Check", "Website Security Check", "dialog title")
          dialog = replace_once(
              dialog,
              "Check a website for PHP2Shell exposure indicators",
              "Check a website for PHP2Shell and critical web-product CVEs",
              "dialog subtitle",
          )
          dialog = replace_once(
              dialog,
              "A clear passive result means the checked page did not expose an affected PHP version. It does not prove that hidden or backend PHP is patched.",
              "A clear passive result means the checked page did not expose a version affected by the security rules EXP IP Scanner currently knows. Hidden or backend components may still require direct verification.",
              "dialog footer",
          )
          dialog_path.write_text(dialog)
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit wiring
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/security.rs src-tauri/src/security/gitlab.rs src/components/DeviceDrawer.tsx src/components/WebsiteCheckDialog.tsx
          git commit -m "Add GitLab critical RCE detection"
          git push origin HEAD:feat/security-cves-1.4.1
