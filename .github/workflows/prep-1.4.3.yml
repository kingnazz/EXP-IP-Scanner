name: Temporary prepare 1.4.3

on:
  push:
    branches:
      - feat/php-service-chip
    paths:
      - .github/workflows/prep-1.4.3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/php-service-chip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare version and release notes
        shell: bash
        run: |
          npm version 1.4.3 --no-git-tag-version
          npm run sync-version
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const changelogPath = 'CHANGELOG.md';
          let changelog = readFileSync(changelogPath, 'utf8');
          const changelogMarker = 'This project uses [semantic versioning](https://semver.org/).\n\n';
          const section = `## 1.4.3\n\n### Added\n\n- The results table now surfaces positively detected PHP runtimes directly in the **Services** column after a passive Security pass.\n- Disclosed versions appear as **PHP X.Y.Z**; PHP that is positively identified without a reliable version appears simply as **PHP**.\n\n### Changed\n\n- The results-table column is renamed from **Open ports** to **Services** because it can now show both port-backed services and detected web runtimes.\n- PHP runtime chips reserve a visible slot even when a device exposes many open ports, so the security-relevant runtime is not hidden behind the overflow count.\n\n### Notes\n\n- PHP is never assigned a fake port. The chip is derived from the existing passive HTTP/HTTPS fingerprint data and only appears when there is positive PHP evidence.\n- Ordinary nginx or Apache responses without PHP evidence do not receive a PHP chip.\n\n`;
          if (!changelog.includes('## 1.4.3')) {
            changelog = changelog.replace(changelogMarker, changelogMarker + section);
            writeFileSync(changelogPath, changelog);
          }

          const releasesPath = 'site/releases.html';
          let releases = readFileSync(releasesPath, 'utf8');
          const listMarker = '          <div class="release-list">\n';
          const card = `            <article class="release-card">\n              <div class="release-version">1.4.3</div>\n              <div class="release-summary">\n                <h3>See detected PHP directly in the Services column</h3>\n                <p>After the passive Security pass identifies PHP, the main results table now shows PHP or the disclosed PHP version beside normal HTTP, HTTPS, SMB, RDP, and other service chips. The runtime stays visible without inventing a fake port.</p>\n              </div>\n              <div class="release-actions">\n                <a href="whats-new-1.4.3.html">Read what changed</a>\n                <a href="https://github.com/nazar-exp/EXP-IP-Scanner/releases/tag/v1.4.3">Downloads</a>\n              </div>\n            </article>\n`;
          if (!releases.includes('whats-new-1.4.3.html')) {
            releases = releases.replace(listMarker, listMarker + card);
            writeFileSync(releasesPath, releases);
          }

          writeFileSync('site/whats-new-1.4.3.html', `<!doctype html>\n<html lang="en">\n  <head>\n    <meta charset="utf-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1" />\n    <title>What’s new in EXP IP Scanner 1.4.3</title>\n    <meta name="description" content="EXP IP Scanner 1.4.3 surfaces detected PHP runtimes directly in the Services column after passive security scanning." />\n    <link rel="canonical" href="https://expipscanner.com/whats-new-1.4.3.html" />\n    <link rel="icon" href="assets/favicon.png" />\n    <meta name="color-scheme" content="light" />\n    <meta name="theme-color" content="#ffffff" />\n    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'" />\n    <link rel="stylesheet" href="exp.v5.css" />\n  </head>\n  <body>\n    <a class="skip" href="#main">Skip to content</a>\n    <header class="site-header">\n      <div class="wrap bar">\n        <a class="brand" href="./" aria-label="EXP IP Scanner home"><img src="assets/exp-ip-scanner-logo.svg" alt="EXP IP Scanner" width="1874" height="347" /></a>\n        <nav aria-label="Site"><a href="./#features">Features</a><a href="./#security">Security</a><a href="./#screenshots">Screenshots</a><a href="releases.html">Changelog</a><a href="privacy.html">Privacy</a><a class="header-cta" href="./#download">Download</a></nav>\n      </div>\n    </header>\n    <main id="main">\n      <section>\n        <div class="wrap whats-new">\n          <p class="kicker">EXP IP Scanner 1.4.3</p>\n          <h1>PHP is visible where you already work.</h1>\n          <p class="lede">Version 1.4.3 brings the passive PHP fingerprint into the main device table. After Security identifies PHP, you can see the runtime beside the device’s normal services without opening every device drawer.</p>\n          <h2>PHP joins the Services column</h2>\n          <p>A disclosed runtime appears as <strong>PHP X.Y.Z</strong>. When PHP is positively identified but its version is hidden, the chip reads simply <strong>PHP</strong>. No version is guessed.</p>\n          <h2>No fake port numbers</h2>\n          <p>PHP is a detected runtime, not a listening port. EXP IP Scanner keeps the real open-port list untouched and adds the PHP chip from passive HTTP/HTTPS fingerprint evidence.</p>\n          <h2>Designed for fast triage</h2>\n          <p>The PHP chip reserves a visible position even when a host has many open services, making it easier to spot systems worth reviewing during a network-wide PHP2Shell security pass.</p>\n          <h2>Still passive</h2>\n          <p>The Security pass continues to use ordinary HTTP and HTTPS response metadata. It does not try credentials, send exploit payloads, or execute code.</p>\n          <div class="cta-row"><a class="btn btn-primary" href="./#download">Download 1.4.3</a><a class="btn btn-secondary" href="releases.html">All releases</a></div>\n        </div>\n      </section>\n    </main>\n    <footer class="site-footer"><div class="wrap"><div class="product-footer"><div class="product-footer-brand"><img src="assets/exp-ip-scanner-logo-light.svg" alt="EXP IP Scanner" width="1874" height="347" /><p>Fast network discovery and focused passive PHP vulnerability checks for consultants.</p></div><nav aria-label="Footer"><a href="./#security">Security</a><a href="./#download">Download</a><a href="releases.html">Changelog</a><a href="privacy.html">Privacy</a><a href="https://github.com/nazar-exp/EXP-IP-Scanner">GitHub</a></nav></div><div class="footer-bottom"><span>EXP IP Scanner · MIT licensed</span><span>Built by EXP Technical</span></div></div></footer>\n  </body>\n</html>\n`);
          NODE
          npm run check-version
          npm run check-release-page
      - name: Commit release prep
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/updater.conf.json site/index.html site/exp.v3.js site/releases.html site/privacy.html site/whats-new-1.4.3.html CHANGELOG.md
          git commit -m "Prepare EXP IP Scanner 1.4.3 release"
          git push origin HEAD:feat/php-service-chip
