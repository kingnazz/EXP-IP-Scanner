[package]
name = "exp-security"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = { version = "0.24", default-features = false }
regex = "1"
x509-parser = "0.18"

[dev-dependencies]
native-tls = "0.2"
tokio-native-tls = "0.3"
